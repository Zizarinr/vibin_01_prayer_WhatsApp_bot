<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184A86" />
      <stop offset="45%" stop-color="#123B6D" />
      <stop offset="100%" stop-color="#08182B" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Dome Arch Gradient -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Inner Shadow / Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1E4E8C" stroke-width="6" />

  <!-- Geometric 8-pointed Islamic Star Accent Ring (Khatim Sulayman / Rub el Hizb background) -->
  <g transform="translate(256, 256)" opacity="0.18">
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="4" transform="rotate(45)" />
  </g>

  <!-- Adhan Notification Sound Waves -->
  <g fill="none" stroke="url(#cyanGlow)" stroke-linecap="round" opacity="0.45">
    <path d="M 196 140 A 100 100 0 0 1 316 140" stroke-width="4" stroke-dasharray="8 6" />
    <path d="M 172 116 A 136 136 0 0 1 340 116" stroke-width="3" stroke-dasharray="6 8" opacity="0.3" />
  </g>

  <!-- Mosque Dome Arch Silhouette -->
  <path d="M 176 380 L 176 270 C 176 210, 256 168, 256 168 C 256 168, 336 210, 336 270 L 336 380 Z"
        fill="url(#domeGrad)" opacity="0.85" />

  <!-- Central Minaret Spire & Pinnacle -->
  <g fill="url(#cyanGlow)">
    <!-- Spire Needle -->
    <path d="M 253 118 L 259 118 L 257 88 Z" />
    <circle cx="256" cy="84" r="5" fill="url(#goldGrad)" />
    <path d="M 256 79 L 256 68" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="256" cy="67" r="2.5" fill="url(#goldGrad)" />

    <!-- Minaret Balcony -->
    <path d="M 244 140 L 268 140 L 264 126 L 248 126 Z" rx="2" />
    <!-- Minaret Shaft -->
    <rect x="250" y="140" width="12" height="60" rx="3" fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- Majestic Crescent Moon (Hilal) -->
  <path d="M 296 170 C 240 180 200 230 200 292 C 200 362 254 414 322 414 C 342 414 362 409 378 400 C 314 416 252 368 252 296 C 252 240 274 195 296 170 Z"
        fill="url(#cyanGlow)" filter="url(#softGlow)" />

  <!-- Sparkling Golden Star at the Crescent Tip -->
  <g transform="translate(340, 206)">
    <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFBEB" />
  </g>

  <!-- Prayer Mihrab Base Line -->
  <line x1="160" y1="380" x2="352" y2="380" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="200" y1="392" x2="312" y2="392" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
</svg>
