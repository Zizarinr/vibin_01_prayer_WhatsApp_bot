<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184A86" />
      <stop offset="50%" stop-color="#123B6D" />
      <stop offset="100%" stop-color="#08182B" />
    </linearGradient>

    <linearGradient id="logoCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="logoDomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Icon (140x140 at x=10, y=10) -->
  <g transform="translate(10, 10)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#logoBgGrad)" stroke="#1E4E8C" stroke-width="2.5" />

    <!-- 8-pointed star in background -->
    <g transform="translate(70, 70)" opacity="0.18">
      <rect x="-38" y="-38" width="76" height="76" rx="6" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2" />
      <rect x="-38" y="-38" width="76" height="76" rx="6" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2" transform="rotate(45)" />
    </g>

    <!-- Dome Arch Silhouette -->
    <path d="M 46 104 L 46 72 C 46 56, 70 44, 70 44 C 70 44, 94 56, 94 72 L 94 104 Z"
          fill="url(#logoDomeGrad)" opacity="0.85" />

    <!-- Minaret Pinnacle -->
    <g fill="url(#logoCyanGlow)">
      <path d="M 69 31 L 71 31 L 70 23 Z" />
      <circle cx="70" cy="22" r="1.5" fill="url(#logoGoldGrad)" />
      <path d="M 67 37 L 73 37 L 72 33 L 68 33 Z" />
      <rect x="68.5" y="37" width="3" height="16" fill="#38BDF8" />
    </g>

    <!-- Crescent Moon (Hilal) -->
    <path d="M 80 46 C 65 48 54 62 54 78 C 54 97 69 112 88 112 C 94 112 99 110 104 108 C 86 112 68 99 68 80 C 68 64 74 52 80 46 Z"
          fill="url(#logoCyanGlow)" />

    <!-- Golden Star -->
    <g transform="translate(93, 56)">
      <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="url(#logoGoldGrad)" />
    </g>

    <!-- Base Line -->
    <line x1="42" y1="104" x2="98" y2="104" stroke="url(#logoGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(176, 0)">
    <!-- Primary Title -->
    <text x="0" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#102A46" letter-spacing="-0.5">
      UNIDA <tspan fill="#1D5FA7">Prayer</tspan>
    </text>

    <!-- V2 Badge -->
    <g transform="translate(340, 36)">
      <rect x="0" y="0" width="48" height="24" rx="12" fill="#EAF2FB" stroke="#93C5FD" stroke-width="1.2" />
      <text x="24" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D5FA7" text-anchor="middle">V2.0</text>
    </g>

    <!-- Campus Subtitle -->
    <text x="0" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="1.2">
      UNIVERSITAS DARUSSALAM GONTOR
    </text>

    <!-- Tagline -->
    <text x="0" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
      Kampus Siman Ponorogo • Bot Pengingat WhatsApp Resmi
    </text>
  </g>
</svg>
